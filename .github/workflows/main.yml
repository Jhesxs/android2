name: Android Emulator Environment

on: workflow_dispatch

jobs:
  android-emulator:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Reset ADB Initial
      run: |
        adb kill-server
        rm -rf ~/.android/adb*
        pkill -9 adb

    - name: Configurar emulador
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        arch: x86_64
        profile: Nexus 6
        disable-animations: true
        script: |
          # Reiniciar servidor ADB
          adb kill-server
          adb start-server
          adb -P 5037 wait-for-device
          
          # Esperar inicialización completa
          while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do
            echo "Esperando inicialización del sistema..."
            sleep 15
          done
          
          # Configuraciones adicionales
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          echo "Emulador listo"

    - name: Exponer y conectar
      run: |
        # Instalar ngrok
        brew install ngrok/ngrok/ngrok
        
        # Reiniciar ADB antes de conectar
        adb kill-server
        adb start-server
        adb -P 5037 wait-for-device
        
        # Exponer puerto ADB
        ngrok tcp 5555 --authtoken ${{ secrets.NGROK_AUTH_TOKEN }} --log=stdout > ngrok.log &
        sleep 20  # Mayor tiempo de espera
        
        # Obtener URL de conexión
        NGROK_URL=$(grep -oE "tcp://(.+).ngrok.io:[0-9]+" ngrok.log | head -n1)
        echo "URL de conexión: $NGROK_URL"
        
        # Conectar via ADB
        adb connect ${NGROK_URL#tcp://}

    - name: Mantener activo
      run: |
        # Verificar conexión periódicamente
        while true; do
          adb kill-server
          adb start-server
          adb -P 5037 wait-for-device
          adb devices -l
          adb shell input keyevent 82
          sleep 300
        done

    - name: Generar claves ADB (Opcional)
      run: |
        # Generar par de claves ADB persistente
        mkdir -p ~/.android
        openssl genpkey -algorithm RSA -out ~/.android/adbkey -pkeyopt rsa_keygen_bits:2048
        openssl rsa -pubout -in ~/.android/adbkey -out ~/.android/adbkey.pub
        cp -r ~/.android /Users/runner/
