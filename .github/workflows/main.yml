name: Android Emulator Environment

on:
  workflow_dispatch:

jobs:
  android-emulator:
    runs-on: macos-latest  # Necesario para aceleración hardware
    timeout-minutes: 360

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup JDK
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'zulu'

    - name: Run Android Emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        arch: x86_64
        profile: Nexus 6
        script: |
          adb wait-for-device
          echo "Emulador iniciado correctamente"
          # Mantener el emulador activo
          while true; do
            sleep 300
            adb shell input keyevent 82
          done

    - name: Exponer puerto con ngrok
      uses: ngrok/action@v1
      with:
        auth-token: ${{ secrets.NGROK_AUTH_TOKEN }}
        region: us
        proto: tcp
        addr: 5555  # Puerto ADB por defecto

    - name: Mantener sesión activa
      run: |
        echo "El emulador está listo para usar"
        while true; do
          sleep 300
          adb devices
        done
