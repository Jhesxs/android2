name: Android Cloud Emulator Tests

on:
  workflow_dispatch: # Permite ejecutar manualmente desde la web de GitHub
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android-tests:
    runs-on: ubuntu-latest # Usa Linux (más rápido para Android que macOS en GitHub)
    strategy:
      matrix:
        include:
          # Configuraciones equivalentes al script original (simplificado)
          - api-level: 25
            abi: "google_apis;arm64-v8a"
          - api-level: 25
            abi: "google_apis;armeabi-v7a"
          - api-level: 24
            abi: "google_apis;arm64-v8a"
          - api-level: 24
            abi: "google_apis;armeabi-v7a"
          # ... Agrega otras configuraciones según necesites
        fail-fast: false # No cancelar todo si una combinación falla

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Create AVD and start emulator
      uses: android-actions/emulator-runner@v2
      with:
        api-level: ${{ matrix.api-level }}
        arch: ${{ contains(matrix.abi, 'arm64-v8a') && 'arm64-v8a' || 'armeabi-v7a' }}
        profile: "Nexus 6" # Perfil de dispositivo
        script: |
          adb devices
          echo "Emulador listo"

    - name: Run Android tests
      run: |
        # Ejemplo: Ejecutar pruebas de Gradle
        ./gradlew connectedAndroidTest

    - name: Upload test results
      if: always() # Sube resultados incluso si falla
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.api-level }}-${{ matrix.abi }}
        path: app/build/reports/
