name: Android Emulator Tests

on:
  workflow_dispatch: # Ejecución manual desde GitHub
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  android-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Configuraciones principales (ajusta según tus necesidades)
          - api-level: 25
            abi: google_apis_arm64-v8a
          - api-level: 24
            abi: google_apis_armeabi-v7a
          - api-level: 23
            abi: google_apis_armeabi-v7a
          # ... Agrega más configuraciones aquí
      fail-fast: false # ✅ Correctamente indentado y sin comillas

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Run Android Emulator
      uses: ReactiveCircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.api-level }}
        arch: ${{ contains(matrix.abi, 'arm64') && 'arm64-v8a' || 'armeabi-v7a' }}
        profile: Nexus 6
        script: |
          adb devices
          ./gradlew connectedCheck

    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.api-level }}-${{ matrix.abi }}
        path: app/build/reports/
