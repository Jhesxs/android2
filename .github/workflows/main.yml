name: Android Emulator Environment

on: workflow_dispatch

jobs:
  android-emulator:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configurar emulador
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        arch: x86_64
        profile: Nexus 6
        disable-animations: true
        script: |
          # Esperar inicialización completa
          adb wait-for-device
          while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do
            echo "Esperando inicialización del sistema..."
            sleep 10
          done
          
          # Configuraciones adicionales
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          
          echo "Emulador listo"

    - name: Exponer y conectar
      run: |
        # Instalar ngrok
        brew install ngrok/ngrok/ngrok
        
        # Exponer puerto ADB
        ngrok tcp 5555 --authtoken ${{ secrets.NGROK_AUTH_TOKEN }} --log=stdout > ngrok.log &
        sleep 15
        
        # Obtener URL de conexión
        NGROK_URL=$(grep -oE "tcp://(.+).ngrok.io:[0-9]+" ngrok.log | head -n1)
        echo "URL de conexión: $NGROK_URL"
        
        # Conectar via ADB
        adb connect ${NGROK_URL#tcp://}

    - name: Mantener activo
      run: |
        while true; do
          adb devices
          adb shell input keyevent 82
          sleep 300
        done
