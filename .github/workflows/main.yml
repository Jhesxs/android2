name: Android Emulator Environment

on: workflow_dispatch

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Configurar entorno Android
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        arch: x86_64
        profile: Nexus 6

    - name: Iniciar emulador con VNC
      run: |
        docker run -d \
          --privileged \
          -p 6080:6080 \
          -p 5554:5554 \
          -p 5555:5555 \
          -e DEVICE="Nexus 5" \
          -v $(pwd)/android_emulator:/root \
          budtmo/docker-android:emulator_11.0

    - name: Exponer con ngrok (versión segura)
      run: |
        curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
        echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
        sudo apt update && sudo apt install ngrok
        ngrok tcp 6080 --authtoken ${{ secrets.NGROK_AUTH_TOKEN }} --log=stdout > ngrok.log &
        sleep 5
        echo "URL de conexión: $(grep 'url=tcp://.ngrok.io' ngrok.log | sed -n 's/.*url=\(.*\)/\1/p')"

    - name: Mantener sesión activa
      run: |
        while true; do
          adb shell input keyevent 82
          sleep 300
        done
