name: Android Emulator Environment

on: workflow_dispatch

jobs:
  android-emulator:
    runs-on: macos-latest  # Obligatorio para aceleración hardware
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configurar emulador
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        arch: x86_64
        profile: Nexus 6
        script: |
          adb wait-for-device
          echo "Emulador inicializado"

    - name: Instalar ngrok
      run: |
        brew install ngrok/ngrok/ngrok

    - name: Exponer puerto ADB (5555)
      run: |
        ngrok tcp 5555 --authtoken ${{ secrets.NGROK_AUTH_TOKEN }} --log=stdout > ngrok.log &
        sleep 5
        echo "URL de conexión: $(grep 'url=tcp://.ngrok.io' ngrok.log | awk -F'url=' '{print $2}')"

    - name: Mantener activo
      run: |
        while true; do
          adb shell input keyevent 82
          sleep 300
        done
